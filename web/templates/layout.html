{{define "layout"}}
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokerhans</title>
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="icon" href="/static/img/favicon.png" type="image/png">
</head>

<body class="bg-gray-100 min-h-screen">
    <header class="bg-poker-green text-white p-4 shadow-md">
        <div class="container mx-auto flex items-center justify-between gap-4">
            <a href="/" class="flex items-center">
                <img src="/static/img/logo.png" alt="Pokerhans Logo" class="h-12 mr-3">
            </a>
            <nav class="flex items-center gap-2 text-sm font-medium">
                <a href="/" class="rounded border border-white/30 px-3 py-2 hover:bg-white/10 {{if eq .Page "leaderboard"}}bg-white text-poker-green hover:bg-white{{end}}">
                    Rangliste
                </a>
                <a href="/seasons" class="rounded border border-white/30 px-3 py-2 hover:bg-white/10 {{if eq .Page "home"}}bg-white text-poker-green hover:bg-white{{end}}">
                    Saisons
                </a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-4">
        {{if eq .Page "leaderboard"}}
            {{template "leaderboard_content" .}}
        {{else if eq .Page "home"}}
            {{template "home_content" .}}
        {{else}}
            {{template "season_content" .}}
        {{end}}
    </main>

    <footer class="bg-white border-t border-gray-200 text-center p-4 mt-12 text-sm text-gray-600">
        <p>&copy; {{.CurrentYear}} <a href="https://v01.io" target="_blank" class="text-poker-green hover:underline">Klaus Breyer</a></p>
    </footer>

    <script>
        // Add any JavaScript here
        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }
    </script>
</body>

</html>
{{end}}
